<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Shopping Bill Table</title>
    </head>
    <body>
        <table border="1" cellspacing="0" cellpadding="10">
            <tr>
                <th colspan="4">Shopping Bill</th>
            </tr>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price (₹)</th>
                <th>Amount (₹)</th>
            </tr>
            <!--ROW 1-->
            <tr>
                <td>Notebook</td>
                <td>2</td>
                <td>50</td>
                <td>100</td>
            </tr>
            <!--ROW 2-->
            <tr>
                <td>Pen</td>
                <td>5</td>
                <td>10</td>
                <td>50</td>
            </tr>
            <!--ROW 3-->
            <tr>
                <td>Book</td>
                <td>1</td>
                <td>200</td>
                <td>200</td>
            </tr>
            <!--ROW 4-->
            <tr>
                <td>Bag</td>
                <td>1</td>
                <td>500</td>
                <td>500</td>
            </tr>
            <!--ROW 5-->
            <tr>
                <th colspan="3">Total</th>
                <th>850</th>
            </tr>
        </table>
    </body>
</html>
